{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>

    {% if form.errors %}
        <div class="bg-red-100 text-red-600 p-3 rounded mb-4">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" class="block font-medium mb-1">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-4">
            <label for="password" class="block font-medium mb-1">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">
            Login
        </button>
    </form>

    <p class="text-center mt-4">
        Don't have an account? 
        <a href="{% url 'register' %}" class="text-blue-500">Register here</a>
    </p>
</div>
{% endblock %}
