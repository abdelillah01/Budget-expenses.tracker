<!-- expenses/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #0a0a0a; /* fallback background */
            color: #e5e7eb; /* Tailwind gray-200 */
        }

        #mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Keep it behind all content */
            background: #0a0a0a; /* base dark tone */
        }
         /* Glassmorphism utility */
    .glass {
        background: rgba(17, 25, 40, 0.7); /* Darker glass */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Form fields (dark mode + glassy) */
    input, select, textarea {
        background: rgba(31, 41, 55, 0.7); /* Tailwind gray-800 with transparency */
        color: #f9fafb; /* text-gray-50 */
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #06b6d4; /* cyan-500 glow */
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        background: rgba(31, 41, 55, 0.85);
    }

     .card {
        @apply bg-black/60 backdrop-blur-2xl border border-white/10 
               shadow-[0_8px_32px_0_rgba(0,0,0,0.7)] 
               px-8 py-12 rounded-3xl transition-all duration-500;
    }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    
    <!-- Mesh Gradient Background -->
    <canvas id="mesh-gradient"></canvas>

    <!-- Navbar -->
    {% include 'expenses/navbar.html' %}

    <!-- Page Content -->
    <main class="flex-grow container mx-auto px-4 py-8 relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Mesh Gradient Script -->
    <script>
        const canvas = document.getElementById("mesh-gradient");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Dark-mode friendly colors
        const colors = ["#1e3a8a", "#2563eb", "#0ea5e9", "#06b6d4"]; 
        // deep navy, blue, cyan, teal
        const blobs = Array.from({ length: 4 }).map((_, i) => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: 350, // smaller but dense blobs
            dx: (Math.random() - 0.5) * 1.5,
            dy: (Math.random() - 0.5) * 1.5,
            color: colors[i]
        }));

        function animate() {
            // Fill background with a dark overlay each frame
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            blobs.forEach(blob => {
                const gradient = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius);
                gradient.addColorStop(0, blob.color + "88"); // semi-transparent (dark mode)
                gradient.addColorStop(1, blob.color + "00");

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                ctx.fill();

                blob.x += blob.dx;
                blob.y += blob.dy;

                if (blob.x < 0 || blob.x > canvas.width) blob.dx *= -1;
                if (blob.y < 0 || blob.y > canvas.height) blob.dy *= -1;
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
