<!-- expenses/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Form fields */
        input, select, textarea {
            background-color: #1f2937 !important; /* Tailwind's gray-800 */
            color: #fff;
            border-radius: 0.375rem;
            padding: 0.5rem;
            width: 100%;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-900 via-black to-gray-900 text-gray-100 min-h-screen flex flex-col">
    
    <!-- Navbar -->
    {% include 'expenses/navbar.html' %}

    <!-- Page Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
