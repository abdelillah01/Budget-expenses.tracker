<!-- templates/expenses/expense_confirm_delete.html -->
{% extends 'base.html' %}
{% include "expenses/navbar.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Expense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-black via-gray-900 to-black text-gray-100 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="glass w-full max-w-md rounded-2xl shadow-lg p-8 space-y-6 text-center">
        <h2 class="text-3xl font-bold text-red-500"> Delete Expense</h2>
        <p class="text-gray-300 text-lg">Are you sure you want to delete this expense?</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit"
                    class="w-full py-2 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-md transition">
                Yes, Delete
            </button>
        </form>

        <a href="{% url 'expense_list' %}" class="text-cyan-400 hover:underline transition">
            ← Cancel and return to expenses
        </a>
    </div>
</body>
</html>

{% endblock %}
