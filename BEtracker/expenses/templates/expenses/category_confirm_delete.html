<!-- templates/categories/category_confirm_delete.html -->
{% extends 'base.html' %}
{% include "expenses/navbar.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-black via-gray-900 to-black text-gray-100 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="glass w-full max-w-lg rounded-2xl shadow-lg p-10 space-y-6 text-center">
        <h2 class="text-3xl font-bold text-red-400">⚠️ Delete Category</h2>
        <p class="text-lg text-gray-300">
            Are you sure you want to delete the category
            <span class="font-semibold text-white">"{{ category.name }}"</span>?
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit"
                    class="w-full py-3 px-6 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition transform hover:scale-[1.02]">
                ✅ Yes, delete
            </button>
            <a href="{% url 'category_list' %}"
               class="inline-block w-full py-3 px-6 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-lg font-semibold transition transform hover:scale-[1.02]">
                ❌ Cancel
            </a>
        </form>
    </div>
</body>
</html>


{% endblock %}
